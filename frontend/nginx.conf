server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resume uploads can be up to 4 MB.
  client_max_body_size 5m;

  # Forward API calls to the backend container.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI job descriptions can take up to a minute.
    proxy_read_timeout 90s;
  }

  # Built files have content hashes in their names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Send every other path to the React app (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
