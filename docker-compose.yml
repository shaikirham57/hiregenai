services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiregen
      POSTGRES_PASSWORD: hiregen_dev_password
      POSTGRES_DB: hiregen
    ports:
      - "5432:5432"
    volumes:
      - hiregen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiregen -d hiregen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hiregen_pgdata:
